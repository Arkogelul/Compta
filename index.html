<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compta</title>
<style>
  :root {
    --bg: #F2F5F4; --surface: #FFFFFF; --fg: #15201C; --muted: #5A6862; --line: #D3DBD8;
    --accent: #1E6B52; --accent-fg: #FFFFFF; --danger: #B42318; --a: #2A53C9; --b: #9C377C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1513; --surface: #161E1B; --fg: #E5ECE9; --muted: #93A29C; --line: #2B3632;
      --accent: #5CC29E; --accent-fg: #0B1411; --danger: #F27A6C; --a: #82A0F7; --b: #E28CC6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.4rem; }
  h2 { margin: 0; font-size: 1rem; text-transform: capitalize; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .pa { color: var(--a); font-weight: 600; }
  .pb { color: var(--b); font-weight: 600; }
  .muted { color: var(--muted); font-size: .85rem; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; }

  #balance { font-size: 1.5rem; line-height: 1.25; margin: 0; }
  #balance .num { font-weight: 700; }

  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .error { color: var(--danger); margin: 0; font-size: .9rem; }

  .month { display: grid; gap: 4px; }
  .month-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 4px 4px; }
  .list { padding: 0; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .label { font-weight: 600; overflow-wrap: anywhere; }
  .del { padding: 4px 9px; font-size: .8rem; color: var(--danger); }
  .del.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }

  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .cat { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: .9rem; }
  .cat button { border: 0; background: none; padding: 0 6px; color: var(--muted); font-size: 1rem; line-height: 1; }
  .cat button:hover { color: var(--danger); }
  .add-cat { display: flex; gap: 8px; }
  .add-cat input { flex: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Compta</h1>
    <span id="session" class="muted" hidden><span id="moi"></span> · <button class="link" type="button" id="logout">Se déconnecter</button></span>
  </header>

  <!-- Connexion : le mot de passe décide qui est connecté -->
  <section class="card" id="lock" hidden>
    <form id="lockForm">
      <label>Mot de passe
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <p id="lockError" class="error" hidden></p>
      <button class="primary" type="submit" id="loginBtn">Se connecter</button>
    </form>
  </section>

  <div id="app" hidden style="display:grid; gap:20px">
    <section class="card">
      <p id="balance">Chargement…</p>
    </section>

    <section class="card">
      <form id="addForm" novalidate>
        <p class="muted" id="formHint" style="margin:0"></p>
        <label>Libellé
          <input type="text" id="label" maxlength="100" placeholder="Loyer octobre, plein d'essence…">
        </label>
        <div class="two">
          <label>Montant (€)
            <input type="text" id="amount" inputmode="decimal" placeholder="0,00">
          </label>
          <label>Date
            <input type="date" id="date">
          </label>
        </div>
        <label>Catégorie
          <select id="cat"></select>
        </label>
        <p id="error" class="error" hidden></p>
        <button class="primary" type="submit" id="addBtn">Ajouter</button>
      </form>
    </section>

    <div id="list" style="display:grid; gap:18px"></div>

    <details class="card">
      <summary>Gérer les catégories</summary>
      <div class="cats" id="cats"></div>
      <form class="add-cat" id="catForm">
        <input type="text" id="newCat" maxlength="30" placeholder="Nouvelle catégorie" aria-label="Nouvelle catégorie">
        <button type="submit">Ajouter</button>
      </form>
    </details>
  </div>
</main>

<script type="module">
// ===== Réglages =====
const NOMS = { a: "Arko", b: "Doodads" };
const EMAILS = { a: "arko@compta-b71bc.firebaseapp.com", b: "doodads@compta-b71bc.firebaseapp.com" };
const CATEGORIES_DEPART = ["EDF", "Free", "Loyer", "Essence", "Courses", "Jardiner"];
const firebaseConfig = {
  apiKey: "AIzaSyCYBCkeT_ePmWBTX5aA7QTyfDJ3kde8vvs",
  authDomain: "compta-b71bc.firebaseapp.com",
  projectId: "compta-b71bc",
  storageBucket: "compta-b71bc.firebasestorage.app",
  messagingSenderId: "1064850035080",
  appId: "1:1064850035080:web:20899cfe8f5a6b9b2aea3d"
};
// ====================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (s) => document.querySelector(s);
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const fmt = (cents) => eur.format(cents / 100);
const other = (p) => (p === "a" ? "b" : "a");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const who = (p) => el("span", p === "a" ? "pa" : "pb", NOMS[p]);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const lignesRef = collection(db, "lignes");
const catsRef = doc(db, "config", "categories");

let moi = null;          // "a" ou "b"
let lignes = [];
let categories = CATEGORIES_DEPART;
let stops = [];
let lockMsg = "";        // message à afficher au prochain écran de connexion

// ----- Connexion -----
function showLock(msg) {
  $("#app").hidden = true;
  $("#session").hidden = true;
  $("#lock").hidden = false;
  $("#lockError").textContent = msg || "";
  $("#lockError").hidden = !msg;
  $("#password").value = "";
  $("#password").focus();
}

$("#lockForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#password").value;
  if (!pw) return;
  $("#loginBtn").disabled = true;
  try {
    // On essaie le compte d'Arko puis celui de Doodads : le bon mot de passe désigne la personne.
    for (const p of ["a", "b"]) {
      try { await signInWithEmailAndPassword(auth, EMAILS[p], pw); return; }
      catch (err) {
        if (err.code === "auth/too-many-requests") throw err;
        if (err.code === "auth/network-request-failed") throw err;
      }
    }
    showLock("Mot de passe incorrect.");
  } catch (err) {
    showLock(err.code === "auth/too-many-requests"
      ? "Trop d'essais. Patientez quelques minutes."
      : "Connexion impossible. Vérifiez votre connexion internet.");
  } finally {
    $("#loginBtn").disabled = false;
  }
});

$("#logout").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  stops.forEach((s) => s());
  stops = [];
  moi = user ? (Object.keys(EMAILS).find((p) => EMAILS[p] === user.email) || null) : null;
  if (!moi) { if (user) signOut(auth); showLock(lockMsg); lockMsg = ""; return; }
  $("#lock").hidden = true;
  $("#app").hidden = false;
  $("#session").hidden = false;
  $("#moi").textContent = `Connecté : ${NOMS[moi]}`;
  $("#formHint").textContent = `Ce que ${NOMS[moi]} a payé pour ${NOMS[other(moi)]}.`;
  stops.push(onSnapshot(lignesRef, (snap) => {
    lignes = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .filter((l) => Number.isFinite(l.amount) && (l.payer === "a" || l.payer === "b"))
      .sort((x, y) => (y.date || "").localeCompare(x.date || "") || (y.createdAt || 0) - (x.createdAt || 0));
    render();
  }, () => { lockMsg = "Accès refusé. Les règles Firestore ne sont pas à jour."; signOut(auth); }));
  stops.push(onSnapshot(catsRef, (snap) => {
    const list = snap.exists() ? snap.data().list : null;
    categories = Array.isArray(list) ? list.filter((c) => typeof c === "string") : CATEGORIES_DEPART;
    renderCats();
  }, () => {}));
});

// ----- Balance et liste -----
function render() {
  // Chaque ligne : le payeur a avancé `amount` pour l'autre, qui lui doit la totalité.
  // net > 0 : Doodads doit à Arko ; net < 0 : Arko doit à Doodads.
  const net = lignes.reduce((n, l) => n + (l.payer === "a" ? l.amount : -l.amount), 0);
  const bal = $("#balance");
  bal.textContent = "";
  if (net === 0) bal.textContent = "Vous êtes quittes.";
  else {
    const debiteur = net > 0 ? "b" : "a";
    bal.append(who(debiteur), " doit ", el("span", "num", fmt(Math.abs(net))), " à ", who(other(debiteur)), ".");
  }

  const list = $("#list");
  list.textContent = "";
  if (!lignes.length) {
    list.append(el("p", "muted", "Aucune ligne pour l'instant. Ajoutez la première avec le formulaire."));
    return;
  }
  const mois = new Map();
  for (const l of lignes) {
    const k = (l.date || "").slice(0, 7);
    if (!mois.has(k)) mois.set(k, []);
    mois.get(k).push(l);
  }
  for (const [k, items] of mois) {
    const sec = el("section", "month");
    const head = el("div", "month-head");
    head.append(el("h2", null, toDate(`${k}-01`).toLocaleDateString("fr-FR", { month: "long", year: "numeric" })));
    const tot = { a: 0, b: 0 };
    for (const l of items) tot[l.payer] += l.amount;
    const sums = el("span", "muted num");
    sums.append(who("a"), ` ${fmt(tot.a)} · `, who("b"), ` ${fmt(tot.b)}`);
    head.append(sums);
    const card = el("div", "card list");
    for (const l of items) card.append(row(l));
    sec.append(head, card);
    list.append(sec);
  }
}

function row(l) {
  const r = el("div", "row");
  const info = el("div");
  info.append(el("div", "label", l.label));
  const meta = el("div", "muted");
  const d = toDate(l.date).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  meta.append(`${d} · payé par `, who(l.payer));
  if (l.cat) meta.append(` · ${l.cat}`);
  info.append(meta);
  r.append(info, el("span", "num", fmt(l.amount)));

  if (l.payer === moi) {
    const del = el("button", "del", "Supprimer");
    del.type = "button";
    let t;
    del.addEventListener("click", async () => {
      if (!del.classList.contains("armed")) {
        del.classList.add("armed");
        del.textContent = "Confirmer";
        t = setTimeout(() => { del.classList.remove("armed"); del.textContent = "Supprimer"; }, 4000);
        return;
      }
      clearTimeout(t);
      del.disabled = true;
      try { await deleteDoc(doc(lignesRef, l.id)); } catch { del.disabled = false; alert("La suppression n'a pas abouti."); }
    });
    r.append(del);
  } else {
    r.append(el("span"));
  }
  return r;
}

// ----- Formulaire -----
function showError(msg) { $("#error").textContent = msg; $("#error").hidden = !msg; }

function parseAmount(s) {
  s = String(s).replace(/[\s  €]/g, "").replace(",", ".");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const c = Math.round(parseFloat(s) * 100);
  return c > 0 ? c : null;
}

$("#addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const label = $("#label").value.trim();
  const amount = parseAmount($("#amount").value);
  const date = $("#date").value;
  const cat = $("#cat").value;
  if (!label) return showError("Indiquez un libellé.");
  if (!amount) return showError("Le montant doit être un nombre positif, par exemple 12,50.");
  if (!date) return showError("Choisissez une date.");
  showError("");
  $("#addBtn").disabled = true;
  try {
    await addDoc(lignesRef, { label, amount, date, cat, payer: moi, createdAt: Date.now() });
    store.set("cat", cat);
    $("#label").value = "";
    $("#amount").value = "";
    $("#label").focus();
  } catch {
    showError("L'enregistrement n'a pas abouti. Vérifiez la connexion.");
  } finally {
    $("#addBtn").disabled = false;
  }
});

// ----- Catégories -----
function renderCats() {
  const sel = $("#cat");
  const current = sel.value || store.get("cat");
  sel.textContent = "";
  sel.append(new Option("Sans catégorie", ""));
  for (const c of categories) sel.append(new Option(c, c));
  sel.value = categories.includes(current) ? current : "";

  const box = $("#cats");
  box.textContent = "";
  for (const c of categories) {
    const chip = el("span", "cat", c);
    const x = el("button", null, "×");
    x.type = "button";
    x.setAttribute("aria-label", `Supprimer la catégorie ${c}`);
    x.addEventListener("click", () => saveCats(categories.filter((k) => k !== c)));
    chip.append(x);
    box.append(chip);
  }
}

async function saveCats(list) {
  try { await setDoc(catsRef, { list }); }
  catch { alert("La modification des catégories n'a pas abouti."); }
}

$("#catForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const c = $("#newCat").value.trim();
  if (!c) return;
  $("#newCat").value = "";
  if (!categories.some((k) => k.toLowerCase() === c.toLowerCase())) saveCats([...categories, c]);
});

// ----- Démarrage -----
$("#date").value = today();
renderCats();
</script>
</body>
</html>
