<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes à deux</title>
<style>
  :root {
    --bg: #F2F5F4; --surface: #FFFFFF; --fg: #15201C; --muted: #5A6862; --line: #D3DBD8;
    --accent: #1E6B52; --accent-fg: #FFFFFF; --danger: #B42318; --a: #2A53C9; --b: #9C377C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1513; --surface: #161E1B; --fg: #E5ECE9; --muted: #93A29C; --line: #2B3632;
      --accent: #5CC29E; --accent-fg: #0B1411; --danger: #F27A6C; --a: #82A0F7; --b: #E28CC6;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 1.4rem; }
  h2 { margin: 0; font-size: 1rem; text-transform: capitalize; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .pa { color: var(--a); font-weight: 600; }
  .pb { color: var(--b); font-weight: 600; }
  .muted { color: var(--muted); font-size: .85rem; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  #balance { font-size: 1.5rem; line-height: 1.25; }
  #balance .num { font-weight: 700; }

  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input, select, button { font: inherit; color: inherit; }
  input, select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .choice { display: flex; gap: 6px; }
  .choice label { flex: 1; display: block; }
  .choice input { position: absolute; opacity: 0; }
  .choice span { display: block; text-align: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--fg); font-weight: 500; }
  .choice input:checked + span { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 700; }
  .choice input:focus-visible + span { outline: 2px solid var(--accent); }
  button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  #error, #lockError { color: var(--danger); margin: 0; font-size: .9rem; }

  .month { display: grid; gap: 4px; }
  .month-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 4px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .label { font-weight: 600; overflow-wrap: anywhere; }
  .del { padding: 4px 9px; font-size: .8rem; color: var(--danger); }
  .del.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
  .list { padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Comptes à deux</h1>

  <!-- Écran du code secret -->
  <section class="card" id="lock" hidden>
    <form id="lockForm">
      <label>Code secret
        <input type="password" id="code" autocomplete="current-password" required>
      </label>
      <p id="lockError" class="muted" hidden></p>
      <button class="primary" type="submit">Ouvrir les comptes</button>
    </form>
  </section>

  <div id="app" hidden style="display:grid; gap:20px">
    <section class="card">
      <p id="balance">Chargement…</p>
    </section>

    <section class="card">
      <form id="addForm" novalidate>
        <div class="choice" role="radiogroup" aria-label="Type">
          <label><input type="radio" name="type" value="achat" checked><span>Achat pour l'autre</span></label>
          <label><input type="radio" name="type" value="remboursement"><span>Remboursement</span></label>
        </div>
        <div class="choice" role="radiogroup" aria-label="Qui a payé">
          <label><input type="radio" name="payer" value="a" checked><span id="dirA"></span></label>
          <label><input type="radio" name="payer" value="b"><span id="dirB"></span></label>
        </div>
        <label>Libellé
          <input type="text" id="label" maxlength="100" placeholder="Loyer octobre, facture EDF…">
        </label>
        <div class="two">
          <label>Montant (€)
            <input type="text" id="amount" inputmode="decimal" placeholder="0,00">
          </label>
          <label>Date
            <input type="date" id="date">
          </label>
        </div>
        <label id="catField">Catégorie
          <select id="cat"></select>
        </label>
        <p id="error" hidden></p>
        <button class="primary" type="submit" id="addBtn">Ajouter</button>
      </form>
    </section>

    <div id="list" style="display:grid; gap:18px"></div>
  </div>
</main>

<script type="module">
// ===== À personnaliser =====
const NOMS = { a: "Arko", b: "Doodads" };
const firebaseConfig = {
  apiKey: "AIzaSyCYBCkeT_ePmWBTX5aA7QTyfDJ3kde8vvs",
  authDomain: "compta-b71bc.firebaseapp.com",
  projectId: "compta-b71bc",
  storageBucket: "compta-b71bc.firebasestorage.app",
  messagingSenderId: "1064850035080",
  appId: "1:1064850035080:web:20899cfe8f5a6b9b2aea3d"
};
const CATEGORIES = ["Loyer", "Électricité, gaz, eau", "Abonnements", "Courses", "Maison", "Sorties", "Transport", "Autre"];
// ===========================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

try {
const $ = (s) => document.querySelector(s);
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const fmt = (cents) => eur.format(cents / 100);
const other = (p) => (p === "a" ? "b" : "a");
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const who = (p) => el("span", p === "a" ? "pa" : "pb", NOMS[p]);

const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};

const db = getFirestore(initializeApp(firebaseConfig));
let lignes = [];
let ref = null;
let stop = null;

// ----- Code secret -----
function showLock(msg) {
  if (stop) { stop(); stop = null; }
  $("#app").hidden = true;
  $("#lock").hidden = false;
  $("#lockError").textContent = msg || "";
  $("#lockError").hidden = !msg;
  $("#code").focus();
}

function open(code) {
  ref = collection(db, "comptes", code, "lignes");
  stop = onSnapshot(ref, (snap) => {
    store.set("code", code);
    $("#lock").hidden = true;
    $("#app").hidden = false;
    lignes = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .filter((l) => Number.isFinite(l.amount) && (l.payer === "a" || l.payer === "b"))
      .sort((x, y) => (y.date || "").localeCompare(x.date || "") || (y.createdAt || 0) - (x.createdAt || 0));
    render();
  }, (err) => {
    store.del("code");
    showLock(err.code === "permission-denied" ? "Code incorrect." : "Connexion impossible. Réessayez plus tard.");
  });
}

$("#lockForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = $("#code").value.trim();
  if (!code || code.includes("/")) return showLock("Code incorrect.");
  open(code);
});

// ----- Affichage -----
function render() {
  // Chaque ligne : le payeur a avancé `amount` pour l'autre (ou l'a remboursé).
  // net > 0 : B doit à A ; net < 0 : A doit à B.
  const net = lignes.reduce((n, l) => n + (l.payer === "a" ? l.amount : -l.amount), 0);
  const bal = $("#balance");
  bal.textContent = "";
  if (net === 0) bal.textContent = "Vous êtes quittes.";
  else {
    const debiteur = net > 0 ? "b" : "a";
    bal.append(who(debiteur), " doit ", el("span", "num", fmt(Math.abs(net))), " à ", who(other(debiteur)), ".");
  }

  const list = $("#list");
  list.textContent = "";
  if (!lignes.length) {
    list.append(el("p", "muted", "Aucune ligne pour l'instant. Ajoutez la première avec le formulaire."));
    return;
  }
  const mois = new Map();
  for (const l of lignes) {
    const k = (l.date || "").slice(0, 7);
    if (!mois.has(k)) mois.set(k, []);
    mois.get(k).push(l);
  }
  for (const [k, items] of mois) {
    const sec = el("section", "month");
    const head = el("div", "month-head");
    head.append(el("h2", null, toDate(`${k}-01`).toLocaleDateString("fr-FR", { month: "long", year: "numeric" })));
    const total = items.filter((l) => l.type !== "remboursement").reduce((s, l) => s + l.amount, 0);
    head.append(el("span", "muted num", `Achats : ${fmt(total)}`));
    const card = el("div", "card list");
    for (const l of items) card.append(row(l));
    sec.append(head, card);
    list.append(sec);
  }
}

function row(l) {
  const r = el("div", "row");
  const info = el("div");
  info.append(el("div", "label", l.label));
  const meta = el("div", "muted");
  const d = toDate(l.date).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  meta.append(`${d} · `, who(l.payer), l.type === "remboursement" ? " a remboursé " : " a payé pour ", who(other(l.payer)));
  if (l.type !== "remboursement" && l.cat) meta.append(` · ${l.cat}`);
  info.append(meta);

  const del = el("button", "del", "Supprimer");
  del.type = "button";
  let t;
  del.addEventListener("click", async () => {
    if (!del.classList.contains("armed")) {
      del.classList.add("armed");
      del.textContent = "Confirmer";
      t = setTimeout(() => { del.classList.remove("armed"); del.textContent = "Supprimer"; }, 4000);
      return;
    }
    clearTimeout(t);
    del.disabled = true;
    try { await deleteDoc(doc(ref, l.id)); } catch { del.disabled = false; alert("La suppression n'a pas abouti."); }
  });

  r.append(info, el("span", "num", fmt(l.amount)), del);
  return r;
}

// ----- Formulaire -----
for (const c of CATEGORIES) $("#cat").append(el("option", null, c));

function updateForm() {
  const remb = document.querySelector("input[name=type]:checked").value === "remboursement";
  const verbe = remb ? " rembourse " : " paie pour ";
  $("#dirA").textContent = NOMS.a + verbe + NOMS.b;
  $("#dirB").textContent = NOMS.b + verbe + NOMS.a;
  $("#catField").hidden = remb;
}
$("#addForm").addEventListener("change", updateForm);

function parseAmount(s) {
  s = String(s).replace(/[\s  €]/g, "").replace(",", ".");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  const c = Math.round(parseFloat(s) * 100);
  return c > 0 ? c : null;
}

function showError(msg) { $("#error").textContent = msg; $("#error").hidden = !msg; }

$("#addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const type = document.querySelector("input[name=type]:checked").value;
  const payer = document.querySelector("input[name=payer]:checked").value;
  const label = $("#label").value.trim() || (type === "remboursement" ? "Remboursement" : "");
  const amount = parseAmount($("#amount").value);
  const date = $("#date").value;
  if (!label) return showError("Indiquez un libellé.");
  if (!amount) return showError("Le montant doit être un nombre positif, par exemple 12,50.");
  if (!date) return showError("Choisissez une date.");
  showError("");
  $("#addBtn").disabled = true;
  try {
    await addDoc(ref, { label, amount, date, payer, type, cat: type === "remboursement" ? "" : $("#cat").value, createdAt: Date.now() });
    $("#label").value = "";
    $("#amount").value = "";
    $("#label").focus();
  } catch {
    showError("L'enregistrement n'a pas abouti. Vérifiez la connexion.");
  } finally {
    $("#addBtn").disabled = false;
  }
});

// ----- Démarrage -----
$("#date").value = today();
updateForm();
const saved = store.get("code");
if (saved) open(saved); else showLock();
} catch (err) {
  document.querySelector("#lock").hidden = false;
  document.querySelector("#lockError").hidden = false;
  document.querySelector("#lockError").textContent = "Configuration Firebase manquante ou invalide dans index.html.";
}
</script>
</body>
</html>
